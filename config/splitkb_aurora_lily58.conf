# Uncomment to enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the splitkb_aurora_lily58 OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
# Disabled - nice_view has its own status widget
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

# ========================================
# BLUETOOTH POWER & INTERFERENCE FIXES
# ========================================
# Maximum transmission power for better signal strength and less interference
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# DISABLE 2M PHY - causes split keyboard connection issues
# See: https://zmk.dev/docs/troubleshooting/connection-issues
CONFIG_BT_CTLR_PHY_2M=n

# ========================================
# LATENCY & RESPONSIVENESS IMPROVEMENTS
# ========================================
# Moderate connection interval for balance between latency and reliability
# Too aggressive settings can break split communication
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=10
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=300

# Faster split communication between halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10

# USB polling rate - faster updates when connected via USB
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# ========================================
# DEBOUNCE SETTINGS
# ========================================
# Standard debounce timing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ========================================
# POWER MANAGEMENT
# ========================================
# Enable sleep (15m)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
